terms_and_conditions:
  - en: "A minute to a network other than e& Egypt is charged as 5 minutes (5 Mixes) from the bundle."
    ar: "الدقيقة لغير شبكة اتصالات مصر تُحتسب كـ5 دقائق (5 مكسات) من الرصيد."
  - en: "Aqwa Card tiers that include video minutes also grant access to specific Entertainment, Social, and Video app categories for that dedicated usage."
    ar: "فئات أقوى كارت التي تشمل دقائق فيديو تمنح أيضاً وصولاً لتطبيقات ترفيهية واجتماعية وفيديو محددة لهذا الاستخدام المخصص."
