family_description_ar: "أقوى كارت هو خط الشحن المرن من اتصالات مصر لعملاء الدفع المسبق: كل شحنة تمنحك رصيد \"مكسات\" تستخدمه بحرية في المكالمات أو الإنترنت أو الرسائل لأي شبكة."

