family: hekaya_mixat
family_name_en: "Hekaya Mixat"
family_name_ar: "حكاية مكسات"
category: mobile
tax_type: prepaid
default_ussd: "*319#"
family_description_en: "Hekaya Mixat is e& Egypt's monthly prepaid mix bundle line: a single monthly quota of \"Mix\" units usable for calls or mobile internet, renewable via *319#, with unused units rolling over on renewal (if renewed on/before the due date; late renewal forfeits leftover Mixes; this month's bundle is consumed before rolled-over Mixes). Conversion rates: 1 Mix = 1 call minute or 1 SMS on the e& network; 5 Mixes = 1 call minute or 1 SMS to other local networks; 1 Mix = 2 MB for social apps (Facebook, Messenger, Instagram, Snapchat, X/Twitter, WhatsApp, TikTok); 1 Mix = 1 MB for other apps/websites. Every tier includes a favorite number billed at 0.5 Mix/minute instead of a full Mix."
family_description_ar: "حكاية مكسات هي باقات الشهرية للدفع المسبق من اتصالات مصر: رصيد شهري واحد من وحدات \"المكس\" يُستخدم في المكالمات أو الإنترنت، يتجدد عبر *319#، مع ترحيل الوحدات غير المستخدمة عند التجديد (فقط عند التجديد في الموعد أو قبله؛ التجديد المتأخر يُفقد الرصيد المتبقي؛ يُستهلك رصيد الشهر الحالي قبل الرصيد المُرحَّل). معدلات التحويل: 1 مكس = دقيقة مكالمة أو رسالة واحدة داخل شبكة اتصالات مصر؛ 5 مكسات = دقيقة مكالمة أو رسالة واحدة لباقي الشبكات؛ 1 مكس = 2 ميجابايت لتطبيقات التواصل (فيسبوك، ماسنجر، انستجرام، سناب شات، إكس/تويتر، واتساب، تيك توك)؛ 1 مكس = 1 ميجابايت لباقي التطبيقات والمواقع. كل باقة تتضمن رقماً مفضلاً بسعر 0.5 مكس/دقيقة بدلاً من مكس كامل."

