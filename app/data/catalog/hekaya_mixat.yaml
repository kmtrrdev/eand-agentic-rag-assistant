# assistant can use to explain why an old price a customer remembers no
# longer applies — never offered as a current, purchasable option.
legacy_tiers_deprecated:
  note_en: "An older Hekaya Mixat pricing generation (35/50/65/100/150/200 EGP) existed before the current 52/69/92/120/180/270 EGP tiers and is no longer sold."
  note_ar: "كان هناك جيل أسعار أقدم لحكاية مكسات (35/50/65/100/150/200 جنيه) قبل الأسعار الحالية (52/69/92/120/180/270 جنيه)، ولم يعد متاحاً للبيع."
  prices_egp: [35, 50, 65, 100, 150, 200]

terms_and_conditions:
  - en: "A minute or SMS to a network other than e& Egypt costs 5 Mixes instead of 1 Mix."
    ar: "الدقيقة أو الرسالة لغير شبكة اتصالات مصر تكلف 5 مكسات بدلاً من مكس واحد."
  - en: "Out-of-bundle overage rate once Mixes are exhausted: 19 piasters per minute or MB, until renewal or an add-on purchase."
    ar: "سعر تجاوز الباقة بعد استهلاك المكسات: 19 قرشاً لكل دقيقة أو ميجابايت، حتى التجديد أو شراء إضافة."
  - en: "A customer who runs out of Mixes can renew early by dialing *807#, instead of waiting for the normal renewal date."
    ar: "يمكن للعميل الذي استهلك مكساته التجديد مبكراً بالاتصال بـ *807#، بدلاً من انتظار موعد التجديد المعتاد."
  - en: "A weekly renewal option is available via *809# (*809*1#, *809*2#, or *809*3# for 1, 2, or 3 weeks) as an alternative to the full monthly renewal."
    ar: "يتوفر خيار تجديد أسبوعي عبر *809# (*809*1# أو *809*2# أو *809*3# لأسبوع أو أسبوعين أو 3 أسابيع) كبديل للتجديد الشهري الكامل."
  - en: "A 50% lifetime discount is available for customers with special needs across all Hekaya Mixat bundles."
    ar: "يتوفر خصم 50% مدى الحياة لعملاء ذوي الاحتياجات الخاصة على جميع باقات حكاية مكسات."
  - en: "Calls to short/hotline numbers (16XXX, 19XXX, 15XXX) are billed at 30 piasters/minute, except 16399 (standard rates) and 16528 (10 piasters/minute)."
    ar: "المكالمات لأرقام الخط الساخن القصيرة (16XXX، 19XXX، 15XXX) تُحاسَب بـ30 قرشاً/دقيقة، ما عدا 16399 (بالسعر العادي) و16528 (10 قروش/دقيقة)."
  - en: "If a customer attempts to renew without sufficient balance, they get a 2-day grace window after recharging to complete the renewal; otherwise they must re-subscribe via USSD."
    ar: "إذا حاول العميل التجديد برصيد غير كافٍ، يحصل على فترة سماح يومين بعد الشحن لإتمام التجديد؛ وإلا يجب إعادة الاشتراك عبر USSD."
  - en: "Useful Hekaya Mixat USSD codes: *011# (best-plan discovery), *304# (international calling for Hekaya Mixat users), *3333# (promotions/balance/migration), *808# (check internet usage), *806# (minute cap management)."
    ar: "أكواد USSD مفيدة لحكاية مكسات: *011# (اكتشاف أفضل باقة)، *304# (المكالمات الدولية لعملاء حكاية مكسات)، *3333# (العروض/الرصيد/التنقل بين الباقات)، *808# (فحص استهلاك الإنترنت)، *806# (إدارة سقف الدقائق)."
