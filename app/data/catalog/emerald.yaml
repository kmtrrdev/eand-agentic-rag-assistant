glossary:
  - term_en: "Emerald"
    term_ar: "إمرالد"
    definition_en: "e& Egypt's premium postpaid mobile program (\"Emerald Family\"), with five tiers: 430, 780, 1120, 1725, 3450."
    definition_ar: "برنامج اتصالات مصر المميز لباقات الدفع الآجل (\"عيلة إمرالد\")، بخمس فئات: 430، 780، 1120، 1725، 3450."
  - term_en: "Family Line"
    term_ar: "خط عائلة"
    definition_en: "An additional line added under the main Emerald package owner's account. Family lines share the account's package and enjoy 10,000 free internal minutes among family members."
    definition_ar: "خط إضافي يُضاف تحت حساب صاحب باقة إمرالد الرئيسية. تشارك خطوط العائلة رصيد الحساب وتتمتع بـ10,000 دقيقة مجانية بين أفراد العائلة."
  - term_en: "Intra Minutes"
    term_ar: "الدقائق الداخلية"
    definition_en: "Free minutes shared exclusively among an Emerald account's own family lines (10,000 minutes/month, common to all tiers)."
    definition_ar: "دقائق مجانية تُستخدم حصرياً بين خطوط العائلة الخاصة بحساب إمرالد (10,000 دقيقة شهرياً، مشتركة بين كل الفئات)."
  - term_en: "eHome DSL and eHome Wireless"
    term_ar: "eHome DSL وeHome Wireless"
    definition_en: "Two home internet discount options an Emerald customer can choose between (not combine): a fixed EGP discount on a DSL line, or on a wireless home internet line, each exchanged for a portion of the tier's local internet quota."
    definition_ar: "خياران لخصم إنترنت منزلي يمكن لعميل إمرالد الاختيار بينهما (وليس الجمع بينهما): خصم بالجنيه على خط DSL منزلي، أو على خط إنترنت منزلي لاسلكي، ويُستبدل كل منهما بجزء من رصيد الإنترنت المحلي للفئة."
  - term_en: "Emerald Points"
    term_ar: "نقاط إمرالد"
    definition_en: "Monthly loyalty points earned by every Emerald tier, redeemable through the MORE Program with partner merchants."
    definition_ar: "نقاط ولاء شهرية تمنحها كل فئة إمرالد، تُستبدل عبر برنامج MORE لدى التجار الشركاء."
  - term_en: "Entertainment E-Coins"
    term_ar: "كوينز إمرالد الترفيهية"
    definition_en: "A separate monthly balance from Emerald Points, used to choose streaming/entertainment subscriptions (Twist Sport, Twist Music, Twist TV, TOD, VIU, Shahid, Starzplay, Amazon Prime)."
    definition_ar: "رصيد شهري منفصل عن نقاط إمرالد، يُستخدم لاختيار اشتراكات ترفيهية وبث (Twist Sport، Twist Music، Twist TV، TOD، VIU، Shahid، Starzplay، Amazon Prime)."
  - term_en: "My e& Egypt App"
    term_ar: "تطبيق My e& Egypt"
    definition_en: "e& Egypt's official self-service app, used by the Emerald customer to manage their account, distribute the package among family lines, and activate roaming."
    definition_ar: "تطبيق الخدمة الذاتية الرسمي لاتصالات مصر، يستخدمه عميل إمرالد لإدارة حسابه، وتوزيع الباقة بين خطوط العائلة، وتفعيل الرومنج."
  - term_en: "7070 Directory"
    term_ar: "دليل 7070"
    definition_en: "A directory assistance service with a per-tier included minute quota (15 minutes for Emerald 430; 30 for 780 and 1120; 60 for 1725 and 3450); extra minutes beyond the included quota cost 1.5 EGP each."
    definition_ar: "خدمة دليل استعلامات برصيد دقائق متضمن حسب الفئة (15 دقيقة لإمرالد 430؛ 30 لـ780 و1120؛ 60 لـ1725 و3450)؛ الدقائق الإضافية بعد الرصيد المتضمن بسعر 1.5 جنيه لكل دقيقة."
  - term_en: "Code *800#"
    term_ar: "كود *800#"
    definition_en: "The USSD code dialed by an Emerald customer to manage their account and package."
    definition_ar: "كود USSD الذي يطلبه عميل إمرالد لإدارة حسابه وباقته."
  - term_en: "GTO"
    term_ar: "GTO"
    definition_en: "The hotel booking partner offering Emerald customers up to 30% off the lowest available online hotel rate."
    definition_ar: "الشريك المتخصص في حجز الفنادق ويقدم لعملاء إمرالد خصماً يصل إلى 30% على أقل سعر متاح عبر الإنترنت."
  - term_en: "ADIB"
    term_ar: "ADIB"
    definition_en: "Abu Dhabi Islamic Bank–Egypt, issuer of the co-branded card with e& Egypt granting Emerald customers airport lounge access."
    definition_ar: "بنك أبوظبي الإسلامي – مصر، مُصدر البطاقة المشتركة مع اتصالات مصر التي تمنح عملاء إمرالد دخول صالات المطارات."
  - term_en: "MORE Program"
    term_ar: "برنامج MORE"
    definition_en: "e& Egypt's general loyalty rewards program where Emerald Points are redeemed with partners like La Poire, Renaissance Cinemas, Roma Pizza, McDonald's, Ghataty, Espresso Lab, Kazyon, and Bath & Body Works."
    definition_ar: "برنامج الولاء العام لاتصالات مصر، حيث تُستبدل نقاط إمرالد لدى شركاء مثل لا بوار، سينمات النهضة، روما بيتزا، ماكدونالدز، غطاطي، إسبريسو لاب، كازيون، وباث آند بودي ووركس."
