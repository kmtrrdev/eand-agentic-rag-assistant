# Cross-tier programs and facts — rendered as their own RAG chunks since they
# apply across the whole family rather than one tier (source: Emerald (2).pdf).
shared_benefits:
  savings_program:
    name_en: "Emerald Savings Program"
    name_ar: "برنامج إمرالد للتوفير"
    cashback_pct: 25
    description_en: "All Emerald customers get 25% cashback on qualifying daily expenses (dining, shopping, etc.), usable as travel discounts. Activate via the PoshSaver app (App Store / Google Play)."
    description_ar: "يحصل كل عملاء إمرالد على استرداد نقدي 25% من المصروفات اليومية المؤهلة (مطاعم، تسوق، إلخ)، تُستخدم كخصومات سفر. يتم التفعيل عبر تطبيق PoshSaver."

  hotel_discounts:
    name_en: "Emerald GTO Hotel Discounts"
    name_ar: "خصومات فنادق GTO لعملاء إمرالد"
    max_discount_pct: 30
    discount_by_tier_en: "10% for Emerald 430 and 780; 15% for Emerald 1120; 20% for Emerald 1725; 30% for Emerald 3450."
    discount_by_tier_ar: "10% لإمرالد 430 و 780؛ 15% لإمرالد 1120؛ 20% لإمرالد 1725؛ 30% لإمرالد 3450."
    description_en: "Instant guaranteed discount up to 30% off the lowest available online hotel rate worldwide, booked through the GTO platform partnered with e& Egypt."
    description_ar: "خصم فوري مضمون يصل إلى 30% على أقل سعر فندقي متاح عبر الإنترنت حول العالم، عبر منصة GTO الشريكة لاتصالات مصر."

  family_lines:
    name_en: "Emerald Family Lines"
    name_ar: "خطوط عائلة إمرالد"
    max_lines_by_tier_en: "1 line (Emerald 430), 2 lines (780), 4 lines (1120), 5 lines (1725), 7 lines (3450)."
    max_lines_by_tier_ar: "خط واحد (إمرالد 430)، خطان (780)، 4 خطوط (1120)، 5 خطوط (1725)، 7 خطوط (3450)."
    intra_family_minutes: 10000
    extra_data_line_egp: 50
    extra_voice_line_egp: 100
    extra_landline_egp: 10
    description_en: "Family lines share the account's quota with a unified bill for all lines, and the account owner can set a maximum bill limit for each family line (My e& Egypt app or *800# to manage/transfer quota). A landline can be added as a family line. Extra lines beyond the package's included count cost 50 EGP/month (data line), 100 EGP/month (voice line), or 10 EGP/month (landline)."
    description_ar: "خطوط العائلة تشارك رصيد الحساب مع فاتورة موحدة لجميع الخطوط، ويمكن لصاحب الحساب تحديد حد أقصى للفاتورة لكل خط عائلة (عبر تطبيق My e& Egypt أو *800# لإدارة/نقل الرصيد). يمكن إضافة خط أرضي كخط عائلة. الخطوط الإضافية بعد الحد المتضمن في الباقة تكلف 50 جنيه/شهر (خط بيانات)، 100 جنيه/شهر (خط مكالمات)، أو 10 جنيه/شهر (خط أرضي)."

  entertainment:
    name_en: "Emerald Entertainment E-Coins"
    name_ar: "كوينز إمرالد الترفيهية"
    ecoins_by_tier: {emerald_430: 1875, emerald_780: 3375, emerald_1120: 4875, emerald_1725: 7500, emerald_3450: 10000}
    services: ["Twist Sport", "Twist Music", "Twist TV", "TOD", "VIU", "Shahid", "Starzplay", "Amazon Prime"]
    description_en: "Every Emerald tier grants a monthly Entertainment E-Coins balance, separate from Emerald loyalty points, used to choose streaming/entertainment subscriptions covering movies, series, music, sports, and an Islamic content service (Twist Sport, Twist Music, Twist TV, TOD, VIU, Shahid, Starzplay, Amazon Prime)."
    description_ar: "كل باقة إمرالد تمنح رصيد كوينز ترفيهية شهري، منفصل عن نقاط الولاء، يُستخدم لاختيار اشتراكات ترفيهية تغطي أفلام ومسلسلات وموسيقى ورياضة وخدمة محتوى إسلامي (Twist Sport، Twist Music، Twist TV، TOD، VIU، Shahid، Starzplay، Amazon Prime)."

  internet_worthy:
    name_en: "Internet Worthy (Internet Flexibility)"
    name_ar: "مرونة الإنترنت (Internet Worthy)"
    rollover_months: 1
    borrow_next_month_pct: 50
    description_en: "Unused local internet rolls over one month, and up to 50% of next month's quota can be borrowed in advance. Internet can be redistributed among family lines via the My e& Egypt app or *800#. Recurring and on-demand internet add-ons are also available."
    description_ar: "الإنترنت غير المستخدم يترحل لشهر واحد، ويمكن اقتراض حتى 50% من رصيد الشهر القادم مقدماً. يمكن إعادة توزيع الإنترنت بين خطوط العائلة عبر تطبيق My e& Egypt أو *800#. تتوفر أيضاً إضافات إنترنت شهرية أو عند الطلب."

  move_club:
    name_en: "MOVE Club Discount"
    name_ar: "خصم نادي MOVE"
    discount_pct: 25
    description_en: "All Emerald customers (every tier) get a 25% discount on MOVE sports club memberships."
    description_ar: "يحصل جميع عملاء إمرالد (كل الباقات) على خصم 25% على اشتراكات نادي MOVE الرياضي."

  exclusive_privileges:
    name_en: "Emerald Exclusive Privileges"
    name_ar: "مزايا إمرالد الحصرية"
    airport_lounges: 840
    description_en: "Free instant access to up to 840 airport VIP lounges worldwide via the co-branded ADIB (Abu Dhabi Islamic Bank–Egypt)–e& Egypt card, a 24/7 personal account manager available to handle any request wherever the customer is globally, and an international concierge service exclusive to Emerald 3450."
    description_ar: "دخول فوري ومجاني لصالات كبار الزوار في حتى 840 مطاراً حول العالم عبر بطاقة ADIB (بنك أبوظبي الإسلامي – مصر) المشتركة مع اتصالات مصر، ومدير حساب شخصي متاح 24/7 لتلبية أي طلب أينما كان العميل حول العالم، وخدمة كونسيرج دولية حصرية لعملاء إمرالد 3450."

# Out-of-bundle usage rates, applicable across all Emerald tiers.
out_of_bundle_rates:
  extra_local_minute_egp: 0.19
  extra_local_sms_egp: 0.30
  extra_international_minute_egp: 8.0
  extra_international_sms_egp: 5.0
  extra_roaming_minute_egp: 1.5
  extra_7070_directory_minute_egp: 1.5
  extra_data_line_monthly_egp: 50.0
  extra_voice_line_monthly_egp: 100.0
  extra_landline_monthly_egp: 10.0
  description_en: "Rates charged when an Emerald customer exceeds package usage: 19 piasters/local minute, 30 piasters/local SMS, 8 EGP/international minute, 5 EGP/international SMS, 1.5 EGP/extra roaming or 7070 Directory minute."
  description_ar: "الأسعار عند تجاوز استخدام الباقة: 19 قرش/دقيقة محلية، 30 قرش/رسالة محلية، 8 جنيه/دقيقة دولية، 5 جنيه/رسالة دولية، 1.5 جنيه/دقيقة رومنج أو دليل 7070 إضافية."

terms_and_conditions:
  - en: "All announced Emerald prices are exclusive of taxes."
    ar: "جميع أسعار إمرالد المعلنة غير شاملة الضرائب."
  - en: "Taxes added monthly: 8% schedule tax, 14% VAT, and a 10 EGP state resource development fee."
    ar: "الضرائب المضافة شهرياً: ضريبة جدول 8%، ضريبة قيمة مضافة 14%، ورسوم تنمية موارد الدولة 10 جنيه."
  - en: "The eHome DSL discount is exchanged for a portion of local internet quota: 2 GB (Emerald 430), 3 GB (780), 5 GB (1120), 10 GB (1725 and 3450)."
    ar: "خصم eHome DSL يُستبدل بجزء من رصيد الإنترنت المحلي: 2 جيجا (إمرالد 430)، 3 جيجا (780)، 5 جيجا (1120)، 10 جيجا (1725 و 3450)."
  - en: "The eHome DSL discount and eHome Wireless discount cannot be combined; the customer must choose one."
    ar: "لا يمكن الجمع بين خصم eHome DSL وخصم eHome Wireless؛ يجب على العميل اختيار أحدهما."
  - en: "The maximum SMS limit is 500 messages for Emerald 430, and 2,000 messages for Emerald 780, 1120, 1725, and 3450."
    ar: "الحد الأقصى للرسائل هو 500 رسالة لإمرالد 430، و 2,000 رسالة لإمرالد 780 و1120 و1725 و3450."
  - en: "The \"Call Filter\" (Nas We Nas) service is included free with all Emerald packages."
    ar: "خدمة \"فلتر المكالمات\" (ناس وناس) متضمنة مجاناً في جميع باقات إمرالد."
  - en: "Roaming must be activated via the My e& Egypt app before travel, and roaming internet only works in the approved country list."
    ar: "يجب تفعيل الرومنج عبر تطبيق My e& Egypt قبل السفر، وإنترنت الرومنج يعمل فقط في قائمة الدول المعتمدة."
  - en: "USSD code *800# is used to manage an Emerald account and package (quota distribution among family lines, etc.)."
    ar: "كود USSD *800# يُستخدم لإدارة حساب وباقة إمرالد (توزيع الرصيد بين خطوط العائلة، إلخ)."
  - en: "7070 Directory minutes included per tier: 15 minutes for Emerald 430; 30 minutes for Emerald 780 and 1120; 60 minutes for Emerald 1725 and 3450. Extra minutes beyond the included quota cost 1.5 EGP each."
    ar: "دقائق دليل 7070 المتضمنة حسب الفئة: 15 دقيقة لإمرالد 430؛ 30 دقيقة لإمرالد 780 و1120؛ 60 دقيقة لإمرالد 1725 و3450. الدقائق الإضافية بعد الرصيد المتضمن بسعر 1.5 جنيه لكل دقيقة."
  - en: "An Emerald customer can benefit from a mobile phone installment plan; the maximum installment value varies based on both the Emerald package tier and the subscription duration."
    ar: "يمكن لعميل إمرالد الاستفادة من خطة تقسيط لهاتف محمول؛ الحد الأقصى لقيمة التقسيط يختلف حسب فئة باقة إمرالد ومدة الاشتراك معاً."

