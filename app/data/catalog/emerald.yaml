family: emerald
family_name_en: "Emerald"
family_name_ar: "إمرالد"
category: postpaid
tax_type: emerald
default_ussd: "Call 111 or visit an e& Egypt store"
family_description_en: "Emerald (\"Emerald Family\") is e& Egypt's premium postpaid mobile program for high-value customers: five tiered packages (Emerald 430/780/1120/1725/3450) offering large internet quotas, family lines, roaming, entertainment E-Coins, and lifestyle privileges. Subscription and line changes go through customer service (111) or an e& Egypt store, not USSD self-activation."
family_description_ar: "إمرالد (\"عيلة إمرالد\") هو برنامج اتصالات مصر المميز لباقات الدفع الآجل لعملاء الاستخدام العالي: خمس باقات متدرجة (إمرالد 430/780/1120/1725/3450) تقدم رصيد إنترنت كبير وخطوط عائلة ورومنج وكوينز ترفيهية ومزايا لايف ستايل. الاشتراك وتغيير الخط يتم عبر خدمة العملاء (111) أو زيارة أحد فروع اتصالات مصر، وليس عبر كود USSD ذاتي."

