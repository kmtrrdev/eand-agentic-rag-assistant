family: dataline
family_name_en: "DataLine"
family_name_ar: "داتا لاين"
category: data_only
tax_type: prepaid
default_ussd: "*130#"
family_description_en: "DataLine is e& Egypt's dedicated data-only SIM line for MiFi routers and USB modems — exclusively for these devices, not for mobile phones. Prices are exclusive of tax. Every core package includes the 'Double the Package' offer (doubles the quota on the first recharge only for a new customer; does not repeat on renewal; the doubled quota's validity follows the base package's validity). Managed via the My e& Egypt app or *130#; renew by sending 1 in an SMS to 130, dialing *130#, or through the app."
family_description_ar: "داتا لاين هو خط بيانات مخصص من اتصالات مصر لأجهزة المودم والراوتر المحمول (MiFi) حصرياً، ولا يعمل على الهواتف المحمولة. الأسعار غير شاملة الضريبة. كل باقة أساسية تتضمن عرض 'مضاعفة الباقة' (يضاعف الرصيد في أول شحنة فقط لعميل جديد، ولا يتكرر عند التجديد، وصلاحية الرصيد المضاعف تتبع صلاحية الباقة الأساسية). تُدار عبر تطبيق My e& Egypt أو *130#؛ التجديد بإرسال الرقم 1 برسالة نصية إلى 130، أو الاتصال بـ *130#، أو عبر التطبيق."

