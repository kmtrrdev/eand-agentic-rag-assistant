terms_and_conditions:
  - en: "DataLine is exclusively dedicated to portable internet devices (MiFi routers and USB Modems) and does not work on mobile phones."
    ar: "داتا لاين مخصصة حصرياً لأجهزة الإنترنت المحمولة (راوتر MiFi وUSB Modem) ولا تعمل على الهواتف المحمولة."
  - en: "DataLine package prices are exclusive of tax; the prepaid recharge tax (42.857%) applies on top of the listed price."
    ar: "أسعار باقات داتا لاين غير شاملة الضريبة؛ تُطبَّق ضريبة الشحن للدفع المسبق (42.857%) فوق السعر المعلن."
  - en: "The Double the Package offer doubles the internet quota on the first recharge only for every new customer, and does not repeat upon renewal; its validity follows the validity of the base package (1, 3, or 6 months)."
    ar: "عرض مضاعفة الباقة يضاعف رصيد الإنترنت في أول شحنة فقط لكل عميل جديد، ولا يتكرر عند التجديد؛ صلاحيته تتبع صلاحية الباقة الأساسية (1 أو 3 أو 6 أشهر)."
  - en: "A DataLine customer can manage and renew their package via the My e& Egypt app, by sending the number 1 in an SMS to 130, or by dialing *130#."
    ar: "يمكن لعميل داتا لاين إدارة وتجديد باقته عبر تطبيق My e& Egypt، أو بإرسال الرقم 1 برسالة نصية إلى 130، أو بالاتصال بـ *130#."
  - en: "Two DataLine add-on packages are available for extra internet: Extra 500 MB for 15 EGP (send 1 in an SMS to 138), and Extra 1 GB for 29 EGP (send 2 in an SMS to 138), both valid for one month."
    ar: "تتوفر باقتان إضافيتان لداتا لاين للإنترنت الإضافي: إكسترا 500 ميجا بسعر 15 جنيه (إرسال 1 برسالة نصية إلى 138)، وإكسترا 1 جيجا بسعر 29 جنيه (إرسال 2 برسالة نصية إلى 138)، وكلاهما صالح لمدة شهر."
  - en: "DataLine has 3 validity tiers: one month (1.8 and 2.5 GB packages), three months (3.5 to 45 GB packages), and six months (the 72 GB package)."
    ar: "لداتا لاين 3 مستويات صلاحية: شهر واحد (باقتا 1.8 و2.5 جيجا)، ثلاثة أشهر (باقات من 3.5 إلى 45 جيجا)، وستة أشهر (باقة 72 جيجا)."
