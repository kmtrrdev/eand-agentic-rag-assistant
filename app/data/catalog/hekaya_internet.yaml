family: hekaya_internet
family_name_en: "Hekaya Internet"
family_name_ar: "حكاية إنترنت"
category: mobile
tax_type: prepaid
default_ussd: "*319#"
family_description_en: "Hekaya Internet is e& Egypt's data-focused prepaid mobile bundle line: 12 main monthly plans (46 to 600 EGP) plus 4 Extra Unit (call/SMS-only) top-ups and 9 short-term Mini plans. Every monthly plan includes 300 call/SMS units and a choice of free-use apps from a 12-app list (1 app on 46/58, 2 on 80-165, 3 on 205-600), plus bundled Twist Sport/Music/TV, with Starzplay added from 132 EGP up, and a Shahid subscription (Mobile on 46-270, VIP on 345-600). Unused MB at cycle end converts to e& money cashback rather than rolling over as data; on-time renewal also earns cashback that grows with consecutive on-time renewals. NOTE: monthly plans are activated/managed via the My e& Egypt app per the current source PDF, which does not corroborate the *319*<code># per-tier codes below (kept as existing catalog entries pending verification) — Mini plans use *200#."
family_description_ar: "حكاية إنترنت هي باقات الإنترنت المخصصة من اتصالات مصر لعملاء الدفع المسبق: 12 باقة شهرية رئيسية (من 46 إلى 600 جنيه) بالإضافة إلى 4 إضافات وحدات فقط (مكالمات/رسائل) و9 باقات ميني قصيرة المدى. كل باقة شهرية تتضمن 300 وحدة مكالمات/رسائل واختيار تطبيقات مجانية من قائمة 12 تطبيق (تطبيق واحد على 46/58، تطبيقان على 80-165، 3 تطبيقات على 205-600)، بالإضافة إلى Twist Sport/Music/TV، مع إضافة Starzplay من فئة 132 جنيه فأعلى، واشتراك Shahid (Mobile على 46-270، VIP على 345-600). الميجابايت غير المستخدمة في نهاية الدورة تتحول إلى استرداد نقدي (كاش باك) في محفظة e& money بدلاً من الترحيل كرصيد بيانات؛ التجديد في الموعد يمنح أيضاً كاش باك يزيد مع التجديدات المتتالية في الموعد. ملاحظة: الباقات الشهرية تُفعَّل وتُدار عبر تطبيق My e& Egypt حسب المصدر الحالي، والذي لا يؤكد أكواد *319*<كود># الخاصة بكل باقة أدناه (محتفظ بها كعناصر موجودة في الكتالوج لحين التحقق) — باقات ميني تستخدم *200#."

