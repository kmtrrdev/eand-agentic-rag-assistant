terms_and_conditions:
  - en: "Every Hekaya Internet monthly plan includes 300 call/SMS units (1 unit per minute to the e& network, 5 units per minute to other networks)."
    ar: "كل باقة شهرية في حكاية إنترنت تتضمن 300 وحدة مكالمات/رسائل (وحدة واحدة لكل دقيقة داخل شبكة اتصالات مصر، 5 وحدات لكل دقيقة لباقي الشبكات)."
  - en: "Customers can convert part of their internet bundle into extra call minutes, or into credit toward any app subscription; a mid-cycle upgrade to a larger plan is also possible at any time, paying only the price difference."
    ar: "يمكن للعميل تحويل جزء من باقة الإنترنت إلى دقائق مكالمات إضافية، أو إلى رصيد لأي اشتراك تطبيق؛ كما يمكن الترقية لباقة أكبر في أي وقت خلال الشهر بدفع فرق السعر فقط."
  - en: "Out-of-bundle overage rate: 19 piasters per minute, SMS, or MB once the plan's units/data are exhausted."
    ar: "سعر تجاوز الباقة: 19 قرشاً لكل دقيقة أو رسالة أو ميجابايت بعد استهلاك وحدات/بيانات الباقة."
  - en: "Hekaya Internet monthly plans are available to new customers; customers can subscribe to Mini plans or renew after expiry even with an active loan (Salfa)."
    ar: "باقات حكاية إنترنت الشهرية متاحة للعملاء الجدد؛ يمكن الاشتراك في باقات ميني أو التجديد بعد الانتهاء حتى مع وجود سلفة نشطة."
  - en: "Hekaya Internet is data-first with 300 included call/SMS units, unlike Hekaya Mixat which uses one unified 'Mix' unit for both calls and data."
    ar: "حكاية إنترنت تركز على البيانات مع 300 وحدة مكالمات/رسائل متضمنة، بخلاف حكاية مكسات التي تستخدم وحدة 'مكس' موحدة للمكالمات والبيانات معاً."

