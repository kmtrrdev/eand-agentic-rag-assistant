<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1380" width="100%" height="100%" style="background:#0B132B; font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Sharp clean arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#34D399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#FBBF24" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#FB7185" />
    </marker>

    <!-- Sleek Card Glow & Drop Shadows -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4002B" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
  </defs>

  <style>
    .title-main { font-size: 24px; font-weight: 900; fill: #F8FAFC; letter-spacing: -0.5px; }
    .title-sub { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .node-title { font-size: 14.5px; font-weight: 800; fill: #F8FAFC; }
    .node-sub { font-size: 11px; font-weight: 500; }
    .node-badge { font-size: 9.5px; font-weight: 800; }
    .edge-label { font-size: 11px; font-weight: 700; fill: #94A3B8; }
    .edge-line { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .edge-dash { fill: none; stroke: #64748B; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 5 4; }
    .edge-active { fill: none; stroke: #38BDF8; stroke-width: 2.2; }
    .edge-repair { fill: none; stroke: #F59E0B; stroke-width: 2.2; stroke-dasharray: 6 4; }
  </style>

  <!-- Deep Tech Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1380" />
    <line x1="300" y1="0" x2="300" y2="1380" />
    <line x1="510" y1="0" x2="510" y2="1380" />
    <line x1="720" y1="0" x2="720" y2="1380" />
    <line x1="920" y1="0" x2="920" y2="1380" />
    <line x1="0" y1="120" x2="1020" y2="120" />
    <line x1="0" y1="380" x2="1020" y2="380" />
    <line x1="0" y1="640" x2="1020" y2="640" />
    <line x1="0" y1="900" x2="1020" y2="900" />
    <line x1="0" y1="1160" x2="1020" y2="1160" />
  </g>

  <!-- ============================================================== -->
  <!-- HEADER & BANNER                                                -->
  <!-- ============================================================== -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#headerGrad)" />
    <text x="65" y="19" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="1">e&amp; EGYPT AI</text>
    <text x="145" y="22" class="title-main">Agentic LangGraph Architecture</text>
    <text x="0" y="52" class="title-sub">Ultra-low latency, multi-turn bilingual bridge, deterministic tools, parallel hybrid retrieval &amp; 3-tier validation</text>
  </g>

  <!-- ============================================================== -->
  <!-- CONNECTING EDGES & PATHS                                       -->
  <!-- ============================================================== -->

  <!-- 1. Start -> Input Guard -->
  <path d="M 510 135 L 510 162" class="edge-line" marker-end="url(#arrow)" />

  <!-- 2. Input Guard -> Classify (clean) -->
  <path d="M 510 228 L 510 262" class="edge-active" marker-end="url(#arrow-blue)" />
  <rect x="518" y="235" width="46" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="541" y="248" text-anchor="middle" font-size="10" font-weight="800" fill="#38BDF8">CLEAN</text>

  <!-- 3. Input Guard -> Output Guard (blocked prompt injection fast-path) -->
  <path d="M 370 195 L 80 195 L 80 1205 L 370 1205" class="edge-dash" marker-end="url(#arrow-rose)" />
  <rect x="90" y="200" width="94" height="20" rx="4" fill="#1E1B4B" stroke="#F43F5E" stroke-width="1"/>
  <text x="137" y="214" text-anchor="middle" font-size="9.5" font-weight="800" fill="#FB7185">BLOCKED / INJECTION</text>

  <!-- 4. Classify -> Fast Greeting Branch (Left) -->
  <path d="M 370 295 L 230 295 L 230 365" class="edge-line" marker-end="url(#arrow-amber)" />
  <rect x="235" y="285" width="70" height="18" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="270" y="298" text-anchor="middle" font-size="10" font-weight="700" fill="#FBBF24">GREETING</text>

  <!-- 5. Classify -> Safe Response Branch (Right) -->
  <path d="M 650 295 L 790 295 L 790 365" class="edge-line" marker-end="url(#arrow-rose)" />
  <rect x="670" y="285" width="96" height="18" rx="4" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
  <text x="718" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FB7185">OUT-OF-SCOPE / 111</text>

  <!-- 6. Fast Greeting -> Output Guard (Fast short-circuit) -->
  <path d="M 230 435 L 230 1190 L 370 1190" class="edge-line" marker-end="url(#arrow)" />

  <!-- 7. Safe Response -> Output Guard (Safe short-circuit) -->
  <path d="M 790 435 L 790 1190 L 650 1190" class="edge-line" marker-end="url(#arrow)" />

  <!-- 8. Classify -> Query Understanding & Profiling -->
  <path d="M 510 330 L 510 365" class="edge-active" marker-end="url(#arrow-blue)" />

  <!-- 9. Query Understanding -> Strategy Router -->
  <path d="M 510 430 L 510 468" class="edge-active" marker-end="url(#arrow-blue)" />

  <!-- 10. Strategy Router -> Clarify Device (Branch) -->
  <path d="M 370 500 L 230 500 L 230 565" class="edge-line" marker-end="url(#arrow-amber)" />
  <rect x="235" y="490" width="105" height="18" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="287" y="503" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FBBF24">DEVICE AMBIGUOUS</text>

  <!-- Clarify -> Output Guard -->
  <path d="M 230 635 L 230 1175 L 370 1175" class="edge-line" marker-end="url(#arrow)" />

  <!-- 11. Strategy Router -> Deterministic Tools (Exact, Code, Budget, Calc) -->
  <path d="M 510 532 L 510 570" class="edge-active" marker-end="url(#arrow-blue)" />
  <rect x="518" y="538" width="138" height="18" rx="4" fill="#0F172A" stroke="#F97316" stroke-width="1"/>
  <text x="587" y="551" text-anchor="middle" font-size="9.5" font-weight="800" fill="#FB923C">EXACT / REC / CALC TOOLS</text>

  <!-- Strategy Router -> Direct Bypass to Query Rewrite (RAG_ONLY) -->
  <path d="M 650 500 L 760 500 L 760 695 L 650 695" class="edge-dash" marker-end="url(#arrow)" />
  <rect x="680" y="580" width="70" height="18" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
  <text x="715" y="593" text-anchor="middle" font-size="9" font-weight="700" fill="#818CF8">RAG ONLY</text>

  <!-- 12. Tools -> Query Rewrite (Unconditional fact-to-search chain) -->
  <path d="M 510 636 L 510 670" class="edge-active" marker-end="url(#arrow-blue)" />

  <!-- 13. Query Rewrite -> Hybrid Retrieval -->
  <path d="M 510 736 L 510 770" class="edge-active" marker-end="url(#arrow-blue)" />

  <!-- 14. Hybrid Retrieval -> Grounded Generation -->
  <path d="M 510 840 L 510 878" class="edge-active" marker-end="url(#arrow-blue)" />

  <!-- 15. Grounded Generation -> 3-Tier Fact Validator -->
  <path d="M 510 948 L 510 985" class="edge-active" marker-end="url(#arrow-blue)" />

  <!-- 16. Validator -> Generation (Conditional Self-Correction / Repair Loop 1x) -->
  <path d="M 650 1020 L 750 1020 L 750 913 L 650 913" class="edge-repair" marker-end="url(#arrow-amber)" />
  <rect x="670" y="955" width="130" height="22" rx="5" fill="#1C1917" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="735" y="970" text-anchor="middle" font-size="10" font-weight="900" fill="#FBBF24">🔄 REPAIR LOOP (1x)</text>

  <!-- 17. Validator -> Output Guard (Passed validation) -->
  <path d="M 510 1055 L 510 1170" class="edge-line" stroke="#34D399" stroke-width="2.2" marker-end="url(#arrow-green)" />
  <rect x="518" y="1100" width="76" height="20" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
  <text x="556" y="1114" text-anchor="middle" font-size="10" font-weight="900" fill="#6EE7B7">✓ PASS</text>

  <!-- 18. Output Guard -> End -->
  <path d="M 510 1238 L 510 1275" class="edge-line" marker-end="url(#arrow)" />

  <!-- ============================================================== -->
  <!-- NODES                                                          -->
  <!-- ============================================================== -->

  <!-- Node: START -->
  <g filter="url(#nodeGlow)" transform="translate(435, 95)">
    <rect width="150" height="40" rx="20" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="24" cy="20" r="7" fill="#10B981" />
    <text x="85" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#F8FAFC">START QUERY</text>
  </g>

  <!-- Node 1: Input Guardrail -->
  <g filter="url(#nodeGlow)" transform="translate(370, 162)">
    <rect width="280" height="66" rx="14" fill="#1E1B4B" stroke="#EF4444" stroke-width="1.8" />
    <text x="18" y="27" class="node-title">🛡️ 1. Input Guardrail</text>
    <text x="18" y="47" class="node-sub" fill="#F87171">Prompt injection defense, safety check &amp; token length</text>
    <rect x="205" y="10" width="62" height="18" rx="9" fill="#7F1D1D"/>
    <text x="236" y="22.5" text-anchor="middle" class="node-badge" fill="#FCA5A5">SECURITY</text>
  </g>

  <!-- Node 2: Intent Classifier & Resolver -->
  <g filter="url(#nodeGlow)" transform="translate(370, 262)">
    <rect width="280" height="68" rx="14" fill="#082F49" stroke="#06B6D4" stroke-width="2" />
    <text x="18" y="26" class="node-title">🎯 2. Intent Classifier &amp; Resolver</text>
    <text x="18" y="45" class="node-sub" fill="#38BDF8">Fast regex &amp; microsecond multi-turn referent resolver</text>
    <rect x="200" y="8" width="68" height="18" rx="9" fill="#0C4A6E"/>
    <text x="234" y="20.5" text-anchor="middle" class="node-badge" fill="#7DD3FC">&lt;1ms FAST</text>
  </g>

  <!-- Side Node: Fast Greeting Branch -->
  <g filter="url(#nodeGlow)" transform="translate(100, 365)">
    <rect width="260" height="70" rx="14" fill="#451A03" stroke="#F59E0B" stroke-width="1.8" />
    <text x="16" y="27" class="node-title">⚡ Fast Greeting</text>
    <text x="16" y="46" class="node-sub" fill="#FCD34D">Instant warm reply for polite greetings</text>
    <text x="16" y="60" class="node-sub" fill="#FDE68A">Bypasses RAG to respond in &lt;10ms</text>
  </g>

  <!-- Side Node: Safe Response Branch -->
  <g filter="url(#nodeGlow)" transform="translate(660, 365)">
    <rect width="260" height="70" rx="14" fill="#4C0519" stroke="#F43F5E" stroke-width="1.8" />
    <text x="16" y="27" class="node-title">🛑 Safe Response &amp; 111</text>
    <text x="16" y="46" class="node-sub" fill="#FDA4AF">Competitor queries &amp; unsupported topics</text>
    <text x="16" y="60" class="node-sub" fill="#FECDD3">Polite deflection with e&amp; support referral</text>
  </g>

  <!-- Node 3: Query Understanding -->
  <g filter="url(#nodeGlow)" transform="translate(370, 365)">
    <rect width="280" height="65" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.8" />
    <text x="18" y="26" class="node-title">🧠 3. Query Profiling</text>
    <text x="18" y="45" class="node-sub" fill="#A5B4FC">Entity extraction, target package &amp; budget parser</text>
    <rect x="205" y="8" width="62" height="18" rx="9" fill="#312E81"/>
    <text x="236" y="20.5" text-anchor="middle" class="node-badge" fill="#C7D2FE">ENTITIES</text>
  </g>

  <!-- Node 4: Strategy Router -->
  <g filter="url(#nodeGlow)" transform="translate(370, 468)">
    <rect width="280" height="64" rx="14" fill="#2E1065" stroke="#A855F7" stroke-width="2" />
    <text x="18" y="26" class="node-title">🧭 4. Strategy Router</text>
    <text x="18" y="45" class="node-sub" fill="#D8B4FE">TOOL_EXACT / RECOMMENDATION / RAG_ONLY</text>
    <rect x="208" y="8" width="58" height="18" rx="9" fill="#581C87"/>
    <text x="237" y="20.5" text-anchor="middle" class="node-badge" fill="#E9D5FF">ROUTER</text>
  </g>

  <!-- Side Node: Device Clarification -->
  <g filter="url(#nodeGlow)" transform="translate(100, 565)">
    <rect width="260" height="70" rx="14" fill="#451A03" stroke="#F59E0B" stroke-width="1.8" />
    <text x="16" y="27" class="node-title">❓ Device Clarification</text>
    <text x="16" y="46" class="node-sub" fill="#FCD34D">Clarifies Phone vs Router/MiFi for generic data</text>
    <text x="16" y="60" class="node-sub" fill="#FDE68A">Short-circuits redundant follow-up calls</text>
  </g>

  <!-- Node 5: Deterministic Catalog Tools -->
  <g filter="url(#nodeGlow)" transform="translate(370, 570)">
    <rect width="280" height="66" rx="14" fill="#431407" stroke="#F97316" stroke-width="2" />
    <text x="18" y="26" class="node-title">🛠️ 5. Deterministic Catalog Tools</text>
    <text x="18" y="45" class="node-sub" fill="#FDBA74">Single-source YAML truth: Prices, USSD codes, 2-tier upsell</text>
    <rect x="188" y="8" width="80" height="18" rx="9" fill="#7C2D12"/>
    <text x="228" y="20.5" text-anchor="middle" class="node-badge" fill="#FED7AA">GROUND TRUTH</text>
  </g>

  <!-- Node 5b: Query Rewrite & Bilingual Bridge -->
  <g filter="url(#nodeGlow)" transform="translate(370, 670)">
    <rect width="280" height="66" rx="14" fill="#0C2A4D" stroke="#0EA5E9" stroke-width="2" />
    <text x="18" y="26" class="node-title">🔄 5b. Query Rewrite &amp; Bridge</text>
    <text x="18" y="45" class="node-sub" fill="#7DD3FC">Reference resolution &amp; AR/EN telecom dictionary bridge</text>
    <rect x="200" y="8" width="68" height="18" rx="9" fill="#075985"/>
    <text x="234" y="20.5" text-anchor="middle" class="node-badge" fill="#BAE6FD">BILINGUAL</text>
  </g>

  <!-- Node 6: Parallel Hybrid Retrieval -->
  <g filter="url(#nodeGlow)" transform="translate(370, 770)">
    <rect width="280" height="70" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="18" y="26" class="node-title">🔍 6. Parallel Hybrid Retrieval</text>
    <text x="18" y="45" class="node-sub" fill="#6EE7B7">ChromaDB Dense + BM25 Morphological Sparse</text>
    <text x="18" y="58" class="node-sub" fill="#A7F3D0">Multilingual Reciprocal Rank Fusion (RRF) &amp; Pruned Rerank</text>
    <rect x="202" y="8" width="66" height="18" rx="9" fill="#047857"/>
    <text x="235" y="20.5" text-anchor="middle" class="node-badge" fill="#D1FAE5">RRF FUSION</text>
  </g>

  <!-- Node 7: Grounded Generator -->
  <g filter="url(#nodeGlow)" transform="translate(370, 878)">
    <rect width="280" height="70" rx="14" fill="#3B0764" stroke="#A855F7" stroke-width="2" />
    <text x="18" y="26" class="node-title">✍️ 7. Grounded Generator</text>
    <text x="18" y="45" class="node-sub" fill="#D8B4FE">Natural conversational intro + strict verified facts</text>
    <text x="18" y="58" class="node-sub" fill="#E9D5FF">Azure gpt-5-mini / local Ollama slot</text>
    <rect x="198" y="8" width="70" height="18" rx="9" fill="#6B21A8"/>
    <text x="233" y="20.5" text-anchor="middle" class="node-badge" fill="#F3E8FF">ANTI-HALLUC</text>
  </g>

  <!-- Node 8: 3-Tier Fact & Number Validator -->
  <g filter="url(#nodeGlow)" transform="translate(370, 985)">
    <rect width="280" height="70" rx="14" fill="#134E4A" stroke="#14B8A6" stroke-width="2" />
    <text x="18" y="26" class="node-title">⚖️ 8. 3-Tier Fact Validator</text>
    <text x="18" y="45" class="node-sub" fill="#5EEAD4">Deterministic regex scan for exact prices &amp; USSD numbers</text>
    <text x="18" y="58" class="node-sub" fill="#99F6E4">Triggers 1x repair loop if hallucinated numbers detected</text>
    <rect x="194" y="8" width="74" height="18" rx="9" fill="#0F766E"/>
    <text x="231" y="20.5" text-anchor="middle" class="node-badge" fill="#CCFBF1">VALIDATION</text>
  </g>

  <!-- Node 9: Output Guardrail -->
  <g filter="url(#nodeGlow)" transform="translate(370, 1170)">
    <rect width="280" height="68" rx="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" />
    <text x="18" y="26" class="node-title">🔒 9. Output Guardrail</text>
    <text x="18" y="45" class="node-sub" fill="#93C5FD">PII scrub, sensitive token redact &amp; formatting polish</text>
    <rect x="198" y="8" width="70" height="18" rx="9" fill="#1D4ED8"/>
    <text x="233" y="20.5" text-anchor="middle" class="node-badge" fill="#DBEAFE">SANITIZER</text>
  </g>

  <!-- Node: END -->
  <g filter="url(#nodeGlow)" transform="translate(435, 1275)">
    <rect width="150" height="40" rx="20" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="24" cy="20" r="7" fill="#3B82F6" />
    <text x="85" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#F8FAFC">CLIENT REPLY</text>
  </g>

  <!-- ============================================================== -->
  <!-- FOOTER & COLOR KEY LEGEND                                      -->
  <!-- ============================================================== -->
  <g transform="translate(60, 1335)">
    <line x1="0" y1="0" x2="900" y2="0" stroke="#334155" stroke-width="1" />
    <g transform="translate(0, 20)">
      <circle cx="10" cy="0" r="5" fill="#EF4444"/>
      <text x="22" y="4" font-size="11" font-weight="600" fill="#94A3B8">Guardrails</text>

      <circle cx="110" cy="0" r="5" fill="#06B6D4"/>
      <text x="122" y="4" font-size="11" font-weight="600" fill="#94A3B8">Classifier</text>

      <circle cx="200" cy="0" r="5" fill="#F59E0B"/>
      <text x="212" y="4" font-size="11" font-weight="600" fill="#94A3B8">Fast Branches</text>

      <circle cx="310" cy="0" r="5" fill="#F97316"/>
      <text x="322" y="4" font-size="11" font-weight="600" fill="#94A3B8">Catalog Tools</text>

      <circle cx="430" cy="0" r="5" fill="#10B981"/>
      <text x="442" y="4" font-size="11" font-weight="600" fill="#94A3B8">Hybrid Search</text>

      <circle cx="560" cy="0" r="5" fill="#A855F7"/>
      <text x="572" y="4" font-size="11" font-weight="600" fill="#94A3B8">Grounded Gen</text>

      <circle cx="680" cy="0" r="5" fill="#14B8A6"/>
      <text x="692" y="4" font-size="11" font-weight="600" fill="#94A3B8">Fact Validation</text>

      <circle cx="800" cy="0" r="5" fill="#FBBF24"/>
      <text x="812" y="4" font-size="11" font-weight="600" fill="#94A3B8">Repair Loop (1x)</text>
    </g>
  </g>
</svg>
